<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>C · CORE-CLUSTER · RESPO</title>

<style>
  body { background:#000; color:#00ffff; font-family:Consolas; padding:20px; }
  h1 { color:#33ccff; text-shadow:0 0 10px #00ffff; }
  .panel { background:#111; border:1px solid #333; padding:15px; margin:20px 0; border-radius:8px; }
  pre { background:#000; border:1px solid #333; padding:12px; border-radius:6px; white-space:pre-wrap; }
</style>

<script>
async function load(path){
  try{
    const r = await fetch("./" + path);
    if(!r.ok) return null;
    return await r.text();
  }catch(e){
    return null;
  }
}

function vector(content){
  return {
    LEN: content.length,
    LINES: content.split("\n").length,
    STATE: content.includes("ERR") ? "kritisch" : "neutral"
  };
}

function status(content){
  if(!content) return "FEHLT";
  if(content.includes("ERR")) return "ORANGE";
  return "GRÜN";
}

async function start(){

  const FILES = [
    "C.room",
    "README.md",
    "id.html",

    // TMP-Cluster
    "RESPO_ARG_SCAN.tmp",
    "SCHACH.tmp",
    "arg.tmp",
    "bauer.tmp",
    "c.tmp",
    "dame.tmp",
    "edit.tmp",
    "error.tmp",
    "fit.tmp",
    "help.tmp",
    "in.tmp",
    "morph.tmp",
    "nord.tmp",
    "octa.tmp",
    "operator.tmp",
    "ost.tmp",
    "pferd.tmp",
    "q.tmp",
    "schachac.tmp",
    "score.tmp",
    "skat.tmp",
    "sued.tmp",
    "tetriz.tmp",
    "tmp.a",
    "tmp.e",
    "tmp.g",
    "tmp.h",
    "tmp.o",
    "tmp.po.raer.tmp",
    "tmp.s",
    "up.tmp",
    "west.tmp",
    "x.tmp",
    "xarg.tmp",
    "z.tmp"
  ];

  const out = document.getElementById("out");

  for(const f of FILES){
    const content = await load(f);
    const vec = vector(content || "");

    const div = document.createElement("div");
    div.className = "panel";
    div.innerHTML = `
      <h2>${f} — ${status(content)}</h2>
      <pre>${content ? content.substring(0,300) : "FEHLT"}</pre>
      <pre>
Länge: ${vec.LEN}
Zeilen: ${vec.LINES}
Status: ${vec.STATE}
      </pre>
    `;
    out.appendChild(div);
  }
}
</script>
</head>

<body onload="start()">

<h1>C · CORE-CLUSTER · RESPO</h1>

<div id="out"></div>

</body>
</html>
