<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>C · OPERATOR-CLUSTER</title>
<style>
body { font-family: Arial; background:#111; color:#eee; }
h1 { color:#6cf; }
.section { margin-bottom:20px; padding:10px; border:1px solid #333; }
pre { background:#222; padding:10px; }
</style>
</head>
<body>

<h1>C · OPERATOR-CLUSTER</h1>

<div class="section">
  <h2>QI (Pipeline 3)</h2>
  <pre id="qiOut">QI wird geladen…</pre>
</div>

<div class="section">
  <h2>IQQ (Pipeline 6)</h2>
  <pre id="iqqOut">IQQ wird geladen…</pre>
</div>

<div class="section">
  <h2>C-Operatoren</h2>
  <pre id="cOps">Operatoren werden geladen…</pre>
</div>

<script type="module">
import { QI } from "../CUBE-MIND/Pipeline 3/QI.js";
import { IQQ } from "../CUBE-MIND/Pipeline 6/IQQ.js";

window.onload = () => {

  // QI ausführen
  const qiResult = QI();
  document.getElementById("qiOut").innerText =
    JSON.stringify(qiResult, null, 2);

  // IQQ ausführen
  const iqqResult = IQQ();
  document.getElementById("iqqOut").innerText =
    JSON.stringify(iqqResult, null, 2);

  // C-Operatoren anzeigen
  const ops = [
    "SCAN.tmp",
    "ARG.tmp",
    "SCHACH.tmp",
    "OCTA.tmp",
    "NORD.tmp",
    "OST.tmp",
    "SUED.tmp",
    "WEST.tmp",
    "MORPH.tmp",
    "ERROR.tmp",
    "FIT.tmp",
    "SCORE.tmp"
  ];

  document.getElementById("cOps").innerText =
    JSON.stringify(ops, null, 2);
};
</script>

</body>
</html>
